[project]
name = "busya"
version = "0.1.0"
description = "Four-stage coding agent: requirements, planning, coding, review."
readme = "README.md"
authors = [
    { name = "Evgeny Bokshitsky", email = "e.bokshitskiy@hh.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "claude-agent-sdk>=0.2.163",
    "langgraph>=1.2.12",
    "typer>=0.27.2",
]

[project.scripts]
busya = "busya:main"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "ASYNC",  # async pitfalls
    "ANN",    # missing annotations
]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true
